name: CI Bot
on:
  issue_comment:
    types:
      - created

  pull_request_review_comment:
    types:
      - created

  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_review
  pull_request_review:
    types:
      - submitted

  issues:
    types:
      - opened
      - labeled
      - unlabeled

  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target
  pull_request_target:
    types:
      - opened
      - synchronize
      - edited
      - converted_to_draft
      - ready_for_review
      - labeled
      - unlabeled

env:
  # This plugins is for anyone who can use it
  PLUGINS: |-
    assign
    auto-cc
    cc

  # This plugins is for author of issue or PR
  AUTHOR_PLUGINS: |-
    label-bug
    label-documentation
    label-enhancement
    label-question
    retest

  # This plugins is for organization member or repository member
  MEMBERS_PLUGINS: |-
    label-duplicate
    label-good-first-issue
    label-help-wanted
    label-invalid
    label-kind
    label-wontfix
    label-bug
    label-documentation
    label-enhancement
    label-question
    hold
    lifecycle
    retest
    transfer-issue

  # This plugins is for in the REVIEWERS environment variable
  REVIEWERS_PLUGINS: |-
    label-lgtm
    retitle

  # This plugins is for in the APPROVERS environment variable
  APPROVERS_PLUGINS: |-
    label-approve
    label
    merge
    base
    rebase
    cherry-pick

  # This plugins is for in the MAINTAINERS environment variable
  MAINTAINERS_PLUGINS: |-
    milestone

  # This plugins is for organization owner or repository owner
  OWNERS_PLUGINS: ""

  REVIEWERS: |-
    yankay
    wzshiming
  APPROVERS: |-
    yankay
    wzshiming
  MAINTAINERS: |-
    yankay
    wzshiming

  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPOSITORY: ${{ github.repository }}

  # It can be `merge`, `rebase`, or `squash`.
  DEFAULT_MERGE_METHOD: squash

  # Number of reviewers automatically requested when a PR is opened
  # (blunderbuss). Set to 0 to disable.
  BLUNDERBUSS_REVIEWER_COUNT: '0'

  # Rules for the require-matching-label check, one per line in the format:
  #   <missing-label> <regexp> [comment...]
  # When an issue or PR has no label matching the regexp, the missing label
  # is applied with an explanatory comment, and removed once a matching
  # label is added. Set to an empty string to disable.
  REQUIRE_MATCHING_LABELS: |-


  # Additional labels the bot is allowed to create, one entry per line.
  # Each entry is either an exact label name, or a prefix ending in a
  # slash (e.g. kind/) which allows any label with that prefix. These are
  # merged with the built-in default list of well-known prow and GitHub
  # labels (see bin/ensure-labels.sh). Labels not matching any entry are
  # never created automatically.
  # LABELS: |-
  #   kind/docs

  DETAILS: |-

    <details>
    <summary>Details</summary>

    Instructions for interacting with me using comments are available here.
    If you have questions or suggestions related to my behavior, please file an issue against the [gh-ci-bot](https://github.com/wzshiming/gh-ci-bot) repository.

    </details>

# https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
permissions:
  actions: write
  checks: read
  contents: write
  deployments: none
  id-token: none
  issues: write
  discussions: read
  packages: none
  pages: none
  pull-requests: write
  repository-projects: read
  security-events: none
  statuses: read

jobs:
  bot:
    name: Bot
    runs-on: ubuntu-latest
    steps:
      - name: Issue Opened
        uses: wzshiming/gh-ci-bot@v1.6.1
        if: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
        env:
          LOGIN: ${{ github.event.issue.user.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
          MESSAGE: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          ISSUE_KIND: issue
          TYPE: created
          GREETING: |-
            Hi @${{ github.event.issue.user.login }},
            感谢您的反馈!
            我们会尽快跟进.

      - name: PR Opened
        uses: wzshiming/gh-ci-bot@v1.6.1
        if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'opened' }}
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MESSAGE: ${{ github.event.pull_request.body }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          ISSUE_KIND: pr
          TYPE: created
          GREETING: |-
            Hi @${{ github.event.pull_request.user.login }},
            感谢您的 PR !
            如果 PR 已经准备就绪可以 `/auto-cc` ,我们会尽快跟进.

      - name: PR Synchronize
        uses: wzshiming/gh-ci-bot@v1.6.1
        if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' }}
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MESSAGE: ""
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          ISSUE_KIND: pr
          TYPE: synchronize

      - name: PR Edited or Draft State Changed
        uses: wzshiming/gh-ci-bot@v1.6.1
        if: ${{ github.event_name == 'pull_request_target' && (github.event.action == 'edited' || github.event.action == 'converted_to_draft' || github.event.action == 'ready_for_review') }}
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MESSAGE: ""
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          ISSUE_KIND: pr
          TYPE: edited

      - name: Issue Labeled or Unlabeled
        uses: wzshiming/gh-ci-bot@v1.6.1
        if: ${{ github.event_name == 'issues' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') }}
        env:
          LOGIN: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
          MESSAGE: ""
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          ISSUE_KIND: issue
          TYPE: ${{ github.event.action }}

      - name: PR Labeled or Unlabeled
        uses: wzshiming/gh-ci-bot@v1.6.1
        if: ${{ github.event_name == 'pull_request_target' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') }}
        env:
          LOGIN: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MESSAGE: ""
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          ISSUE_KIND: pr
          TYPE: ${{ github.event.action }}

      - name: Issue Commented
        uses: wzshiming/gh-ci-bot@v1.6.1
        if: ${{ github.event_name == 'issue_comment' && !github.event.issue.pull_request }}
        env:
          LOGIN: ${{ github.event.comment.user.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
          MESSAGE: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_KIND: issue
          TYPE: comment

      - name: PR Review Commented
        uses: wzshiming/gh-ci-bot@v1.6.1
        if: ${{ github.event_name == 'pull_request_review_comment' }}
        env:
          LOGIN: ${{ github.event.comment.user.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MESSAGE: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_KIND: pr
          TYPE: comment

      - name: PR Review Submitted
        uses: wzshiming/gh-ci-bot@v1.6.1
        if: ${{ github.event_name == 'pull_request_review' && github.event.review.body != '' }}
        env:
          LOGIN: ${{ github.event.review.user.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MESSAGE: ${{ github.event.review.body }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.review.author_association }}
          ISSUE_KIND: pr
          TYPE: comment

      - name: PR Commented
        uses: wzshiming/gh-ci-bot@v1.6.1
        if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
        env:
          LOGIN: ${{ github.event.comment.user.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
          MESSAGE: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_KIND: pr
          TYPE: comment
